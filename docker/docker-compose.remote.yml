name: vela-studio-remote

services:
  studio:
    container_name: vela-studio-remote
    build:
      context: ..
      dockerfile: apps/studio/Dockerfile
      target: dev
    ports:
      - '3000:3000'
    command: ['pnpm', 'exec', 'turbo', 'run', 'dev', '--filter=studio', '--parallel', '--env-mode=loose']
    restart: unless-stopped
    volumes:
      - '../apps:/app/apps:Z'
      - '../packages:/app/packages:Z'
      - 'nextjs-compiler-cache:/app/apps/studio/.next/dev/cache'
      - 'root-node-modules:/app/node_modules'
      - 'studio-node-modules:/app/apps/studio/node_modules'
      - 'api-types-node-modules:/app/packages/api-types/node_modules'
      - 'build-icons-node-modules:/app/packages/build-icons/node_modules'
      - 'common-node-modules:/app/packages/common/node_modules'
      - 'config-node-modules:/app/packages/config/node_modules'
      - 'eslint-config-node-modules:/app/packages/eslint-config-supabase/node_modules'
      - 'icons-node-modules:/app/packages/icons/node_modules'
      - 'pg-meta-node-modules:/app/packages/pg-meta/node_modules'
      - 'shared-data-node-modules:/app/packages/shared-data/node_modules'
      - 'tsconfig-node-modules:/app/packages/tsconfig/node_modules'
      - 'ui-node-modules:/app/packages/ui/node_modules'
      - 'ui-patterns-node-modules:/app/packages/ui-patterns/node_modules'
    environment:
      VELA_PLATFORM_DEV_MODE: 'true'

      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}

      # Server-side Keycloak (Next.js API routes call these)
      VELA_PLATFORM_KEYCLOAK_ISSUER: 'https://${VELA_REMOTE_HOST}/auth/realms/vela'
      VELA_PLATFORM_KEYCLOAK_CLIENT_ID: frontend
      VELA_PLATFORM_KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      VELA_PLATFORM_KEYCLOAK_AUTHORIZATION_ENDPOINT: 'https://${VELA_REMOTE_HOST}/auth/realms/vela/protocol/openid-connect/auth'
      VELA_PLATFORM_KEYCLOAK_TOKEN_ENDPOINT: 'https://${VELA_REMOTE_HOST}/auth/realms/vela/protocol/openid-connect/token'
      VELA_PLATFORM_KEYCLOAK_USERINFO_ENDPOINT: 'https://${VELA_REMOTE_HOST}/auth/realms/vela/protocol/openid-connect/userinfo'
      VELA_PLATFORM_KEYCLOAK_LOGOUT_ENDPOINT: 'https://${VELA_REMOTE_HOST}/auth/realms/vela/protocol/openid-connect/logout'
      VELA_PLATFORM_KEYCLOAK_JWKS_ENDPOINT: 'https://${VELA_REMOTE_HOST}/auth/realms/vela/protocol/openid-connect/certs'
      VELA_PLATFORM_GOTRUE_URL: 'https://${VELA_REMOTE_HOST}/auth'

      # Client-side Keycloak vars (resolved at runtime in next dev mode)
      NEXT_PUBLIC_VELA_PLATFORM_EXT_KEYCLOAK_URL: 'https://${VELA_REMOTE_HOST}/auth'
      NEXT_PUBLIC_VELA_PLATFORM_KEYCLOAK_URL: 'https://${VELA_REMOTE_HOST}/auth'
      NEXT_PUBLIC_VELA_PLATFORM_KEYCLOAK_REALM: vela
      NEXT_PUBLIC_VELA_PLATFORM_KEYCLOAK_CLIENT_ID: frontend

      # Remote platform / controller
      VELA_PLATFORM_EXT_SIGN_IN_URL: 'https://${VELA_REMOTE_HOST}/sign-in'
      VELA_PLATFORM_EXT_BASE_URL: 'https://${VELA_REMOTE_HOST}'
      VELA_PLATFORM_EXT_API_SERVICE_URL: 'https://${VELA_REMOTE_HOST}/api'
      VELA_PLATFORM_URL: 'https://${VELA_REMOTE_HOST}/vela'

volumes:
  nextjs-compiler-cache:
  root-node-modules:
  studio-node-modules:
  api-types-node-modules:
  build-icons-node-modules:
  common-node-modules:
  config-node-modules:
  eslint-config-node-modules:
  icons-node-modules:
  pg-meta-node-modules:
  shared-data-node-modules:
  tsconfig-node-modules:
  ui-node-modules:
  ui-patterns-node-modules:
